version: "3.9"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      # Single-broker factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on: [kafka]
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
  connect:
    build:
      context: .
      dockerfile: connect.Dockerfile
    image: fraud/connect-s3:dev
    depends_on:
      - kafka
      - minio
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/java/aiven-s3
      CONNECT_HEAP: "-Xms512M -Xmx512M"
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx5G"  
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports: ["9000:9000","9001:9001"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
  
  # Phase 2 additions
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    
  mlflow:
    image: python:3.11-slim
    ports: ["5000:5000"]
    volumes: 
      - mlflow_data:/mlflow
      - ./mlflow_requirements.txt:/requirements.txt
    working_dir: /mlflow
    command: >
      sh -c "pip install -r /requirements.txt && 
             mlflow server --backend-store-uri sqlite:///mlflow.db 
             --default-artifact-root /mlflow/artifacts 
             --host 0.0.0.0 --port 5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow.db

  airflow-postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.7.3-python3.11
    depends_on:
      - airflow-postgres
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'znk3VWbwNUfP3CRU-4b8ZyTrFT2WKTY2yMT7c5g7bLs='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    user: "50000:0"
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - ./pipelines/airflow/logs:/opt/airflow/logs
      - ./pipelines/airflow/plugins:/opt/airflow/plugins
      - airflow_data:/opt/airflow
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.11
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    ports: ["8080:8080"]
    user: "50000:0"
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - ./pipelines/airflow/logs:/opt/airflow/logs
      - ./pipelines/airflow/plugins:/opt/airflow/plugins
      - airflow_data:/opt/airflow
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.11
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    user: "50000:0"
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - ./pipelines/airflow/logs:/opt/airflow/logs
      - ./pipelines/airflow/plugins:/opt/airflow/plugins
      - airflow_data:/opt/airflow
    command: airflow scheduler

  producer:
    build:
      context: ./services/producer
    image: fraud/producer:dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092          # internal listener
      TARGET_TPS: "1000"                    # raise target now
      RNG_SEED: "42"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8001"                               # metrics port (internal)
    # (Optional) map port if you want to curl metrics from host:
    # ports:
    #   - "8001:8001"
    restart: unless-stopped

  features-stream:
    build:
      context: ./services/features_stream
    image: fraud/features-stream:dev
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: "8002"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8002"
    restart: unless-stopped

volumes:
  redis_data:
  mlflow_data:
  postgres_data:
  airflow_data: